   SÉANCE — logging + minuteur de repos + historique
   ============================================================ */
function fmtTime(s) { s = Math.max(0, Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
const Timer = {
  t: null, left: 0,
  start(sec) {
    this.left = sec; this._show(); this._paint(); clearInterval(this.t);
    this.t = setInterval(() => { this.left--; if (this.left <= 0) { this.stop(); this._ding(); } else this._paint(); }, 1000);
  },
  _paint() { document.getElementById('timerTxt').textContent = fmtTime(this.left); },
  add(s) { if (!this.t) return; this.left = Math.max(1, this.left + s); this._paint(); },
  _show() { document.getElementById('timerbar').classList.add('show'); },
  stop() { clearInterval(this.t); document.getElementById('timerbar').classList.remove('show');
    const a = document.getElementById('diffask'); if (a) a.classList.remove('up'); },
  _ding() {
    try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {}
    try { const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(); const g = a.createGain();
      o.connect(g); g.connect(a.destination); o.frequency.value = 880; o.type = 'sine'; g.gain.setValueAtTime(.001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(.3, a.currentTime + .02); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .5);
      o.start(); o.stop(a.currentTime + .5); } catch (e) {}
    toast('⏱ Repos terminé — go !');
  }
};

const Seance = {
  render() {
    const v = document.getElementById('v-seance');
    if (S.activeSession) return this._renderActive(v);
    // écran de démarrage
    const hist = S.history.slice().reverse();
    v.innerHTML = `
      <div class="sec-hd"><div><h2>SÉANCE <span>DU JOUR</span></h2><p>Choisis la séance à démarrer</p></div></div>
      <div class="grid" style="grid-template-columns:1fr">
        ${S.program.map((d,i)=>`<div class="tile" onclick="Seance.start(${i})"><div class="tile-row">
          <div class="tile-thumb" style="font-family:'Bebas Neue';font-size:22px;color:var(--red);background:var(--bg3)">J${i+1}</div>
          <div class="tile-b"><h4>${esc(d.name)}</h4><p>${d.exos.length} exercices · ${d.exos.reduce((a,e)=>a+(+e.sets||0),0)} séries</p></div>
          <div class="btn sm green">▶</div></div></div>`).join('')}
      </div>
      <div class="sec-hd" style="margin-top:26px"><div><h2>HISTORIQUE</h2><p>${S.history.length} séance${S.history.length>1?'s':''} enregistrée${S.history.length>1?'s':''}</p></div></div>
      ${hist.length ? hist.map(h=>this._histTile(h)).join('') : '<div class="empty"><p>Pas encore de séance terminée.<br>Lance-toi 💪</p></div>'}`;
  },
  _histTile(h) {
    const vol = this._volume(h);
    return `<div class="tile" onclick="Seance.viewHist('${h.id}')"><div class="tile-row">
      <div class="tile-thumb" style="background:var(--bg3);font-size:18px">📅</div>
      <div class="tile-b"><h4>${esc(h.dayName)}</h4><p>${fmtDate(h.date)} · ${h.entries.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0)} séries · ${Math.round(vol)} kg volume</p></div>
      <button class="iconbtn" style="width:32px;height:32px;color:#FF7B6B" onclick="event.stopPropagation();Seance.delHist('${h.id}')">✕</button>
    </div></div>`;
  },
  _volume(h) { let v = 0; h.entries.forEach(e => e.sets.forEach(s => { if (s.done) v += (parseFloat(s.weight)||0) * (parseInt(s.reps)||0); })); return v; },
  start(i) {
    const begin = () => {
      const d = S.program[i];
      S.activeSession = { id: uid(), date: new Date().toISOString(), dayId: d.id, dayName: d.name,
        entries: d.exos.map(e => {
          const w = (e.load || '').match(/[\d.]+/); const wv = w ? w[0] : '';
          const rp = String(e.reps).match(/\d+/); const rv = rp ? rp[0] : '';
          const base = LIBMAP[e.k] || {};
          return { exoId: e.id, k: e.k || null, name: e.name, folder: e.folder, photos: e.photos, tip: e.tip,
            zp: [...(e.zp || base.zp || [])], zs: [...(e.zs || base.zs || [])],
            rest: +e.rest || base.drest || 90,
            sets: Array.from({ length: Math.max(1, +e.sets || 1) }, () => ({ weight: wv, reps: rv, done: false, d: null })) };
        }) };
      save(); if (App.tab !== 'seance') App.go('seance'); else this.render();
    };
    if (S.activeSession && S.activeSession.dayId !== S.program[i].id)
      Modal.confirm('Séance en cours', 'Une séance est déjà en cours. La remplacer ?', () => { Modal.close(); begin(); }, 'Remplacer');
    else begin();
  },
  /* Exercice courant : celui qu'on a choisi s'il reste des séries, sinon le premier inachevé */
  _focus() {
    const s = S.activeSession;
    if (s.focus != null && s.entries[s.focus] && s.entries[s.focus].sets.some(x => !x.done)) return s.focus;
    return s.entries.findIndex(e => e.sets.some(x => !x.done));
  },
  goTo(ei) {
    S.activeSession.focus = ei; save(); Ask.close();
    this._renderActive(document.getElementById('v-seance'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  },

  _renderActive(v) {
    const s = S.activeSession;
    const doneSets = s.entries.reduce((a, e) => a + e.sets.filter(x => x.done).length, 0);
    const totSets = s.entries.reduce((a, e) => a + e.sets.length, 0);
    const ei = this._focus();
    const head = `
      <div class="sec-hd"><div><h2>${esc(s.dayName)}</h2><p>${doneSets}/${totSets} séries · ${Math.round(this._volume(s))} kg soulevés</p></div>
        <button class="iconbtn on" onclick="Seance.cancel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="mtrack" style="height:8px;margin-bottom:16px"><div class="mfill" style="width:${totSets?doneSets/totSets*100:0}%;background:var(--green)"></div></div>`;

    if (ei < 0) {
      v.innerHTML = head + `
        <div class="empty"><p>Toutes les séries sont validées.<br>Belle séance 💪</p></div>
        <button class="btn green block" onclick="Seance.finish()">✓ Terminer la séance</button>
        <button class="btn ghost block danger" style="margin-top:10px" onclick="Seance.cancel()">Abandonner</button>`;
      return;
    }

    const en = s.entries[ei];
    const si = en.sets.findIndex(x => !x.done);
    const st = en.sets[si];
    const stepW = loadStep(en.k) || 2.5;
    const rest = +en.rest || 90;

    v.innerHTML = head + `
      <div class="card curexo">
        <div class="exo-top" style="cursor:default">
          <div class="img-zone" style="width:64px;height:64px">${exoImg(en)}</div>
          <div class="exo-main">
            <div class="exo-name">${esc(en.name)}</div>
            <div class="machine">Exercice ${ei + 1}/${s.entries.length}${en.eq ? ' · ' + esc(en.eq) : ''}</div>
          </div>
        </div>

        <div class="setcount">Série <b>${si + 1}</b> <span>sur ${en.sets.length}</span></div>
        ${st.hint ? `<div class="sethint">${st.hint}</div>` : ''}

        <div class="bigrow">
          <div class="bigfield"><label>Charge (kg)</label>
            <div class="bigctrl">
              <button onclick="Seance.bump(${ei},${si},'weight',-${stepW})">−</button>
              <input id="fW" class="biginput" inputmode="decimal" placeholder="—" value="${esc(st.weight)}"
                     oninput="Seance.setField(${ei},${si},'weight',this.value)">
              <button onclick="Seance.bump(${ei},${si},'weight',${stepW})">+</button>
            </div></div>
          <div class="bigfield"><label>Répétitions</label>
            <div class="bigctrl">
              <button onclick="Seance.bump(${ei},${si},'reps',-1)">−</button>
              <input id="fR" class="biginput" inputmode="numeric" placeholder="—" value="${esc(st.reps)}"
                     oninput="Seance.setField(${ei},${si},'reps',this.value)">
              <button onclick="Seance.bump(${ei},${si},'reps',1)">+</button>
            </div></div>
        </div>

        <button class="btn green block bigbtn" onclick="Seance.validate(${ei},${si})">✓ Valider la série</button>

        <div class="setactions">
          <button class="btn sm ghost" onclick="Seance.editRest(${ei})">⏱ ${fmtTime(rest)}</button>
          <button class="btn sm ghost" onclick="Seance.muscles(${ei})">🧍 Muscles</button>
          ${en.tip ? `<button class="btn sm ghost" onclick="toast('💡 '+${JSON.stringify(en.tip).replace(/"/g, '&quot;')})">💡 Conseil</button>` : ''}
          <button class="btn sm ghost" onclick="Seance.addSet(${ei})">+ Série</button>
          ${en.sets.length > 1 ? `<button class="btn sm ghost" onclick="Seance.rmSet(${ei})">− Série</button>` : ''}
        </div>

        ${en.sets.some(x => x.done) ? `<div class="donelist">
          ${en.sets.map((x, i) => x.done ? `<div class="setdone" onclick="Seance.reopen(${ei},${i})">
            <span class="n">${i + 1}</span>
            <span class="w">${esc(x.weight || '—')} kg × ${esc(x.reps || '—')}</span>
            ${x.d && DIFFMAP[x.d] ? `<span class="dtag" style="background:${DIFFMAP[x.d].col}">${DIFFMAP[x.d].ic} ${DIFFMAP[x.d].lab}</span>` : '<span class="dtag none">ressenti ?</span>'}
            <span class="undo">↺</span></div>` : '').join('')}
        </div>` : ''}
      </div>

      <div class="sec-hd" style="margin-top:20px"><div><h2>SUITE</h2><p>Touche un exercice pour y aller</p></div></div>
      ${s.entries.map((e, i) => {
        if (i === ei) return '';
        const dn = e.sets.filter(x => x.done).length;
        const fini = dn === e.sets.length;
        return `<div class="tile${fini ? ' fini' : ''}" onclick="Seance.goTo(${i})"><div class="tile-row">
          <div class="tile-thumb" style="width:44px;height:44px">${exoImg(e)}</div>
          <div class="tile-b"><h4>${esc(e.name)}</h4><p>${dn}/${e.sets.length} séries${fini ? ' · terminé ✓' : ''}</p></div>
        </div></div>`;
      }).join('')}

      <button class="btn green block" style="margin-top:14px" onclick="Seance.finish()">✓ Terminer la séance</button>
      <button class="btn ghost block danger" style="margin-top:10px" onclick="Seance.cancel()">Abandonner</button>`;
  },

  setField(ei, si, f, val) { S.activeSession.entries[ei].sets[si][f] = val; save(); },

  bump(ei, si, f, d) {
    const st = S.activeSession.entries[ei].sets[si];
    const cur = parseFloat(st[f]);
    let val = (isNaN(cur) ? (f === 'weight' ? 0 : 10) : cur) + d;
    if (val < 0) val = 0;
    st[f] = String(round(val, 2)); save();
    const el = document.getElementById(f === 'weight' ? 'fW' : 'fR');
    if (el) el.value = st[f];
  },

  /* Valider une série : on demande le ressenti AVANT de lancer le chrono */
  validate(ei, si) {
    const en = S.activeSession.entries[ei], st = en.sets[si];
    st.done = true;
    /* report immédiat sur la série suivante ; le ressenti l'ajustera ensuite */
    const next = en.sets[si + 1];
    if (next && !next.done) { next.weight = st.weight; next.reps = st.reps; next.hint = ''; }
    save();
    Ask.open(ei, si);
    this._renderActive(document.getElementById('v-seance'));
  },

  /* Rouvrir une série déjà validée pour la corriger */
  reopen(ei, si) {
    const st = S.activeSession.entries[ei].sets[si];
    st.done = false; st.d = null;
    S.activeSession.focus = ei; save(); Ask.close(); Timer.stop();
    this._renderActive(document.getElementById('v-seance'));
  },

  /* Conservé pour compatibilité : bascule validé / non validé */
  toggleSet(ei, si) {
    const st = S.activeSession.entries[ei].sets[si];
    if (st.done) this.reopen(ei, si); else this.validate(ei, si);
  },

  muscles(ei) { Muscles.show(S.activeSession.entries[ei]); },

  editRest(ei) {
    const en = S.activeSession.entries[ei];
    const P = [30, 45, 60, 75, 90, 105, 120, 150, 180, 240];
    Modal.open('Temps de repos', `
      <p class="hint" style="margin-bottom:12px">${esc(en.name)} — déclenché après le recueil du ressenti. La valeur est aussi mémorisée dans ton programme.</p>
      <div class="restgrid" id="restGrid">${P.map(v => `<button class="restchip ${(+en.rest || 90) === v ? 'on' : ''}" data-v="${v}" onclick="Seance.setRest(${ei},${v})">${fmtTime(v)}</button>`).join('')}</div>
      <div class="divider"></div>
      <div class="restbump">
        <button class="btn sm ghost" onclick="Seance.bumpRest(${ei},-15)">− 15 s</button>
        <span id="restNow">${fmtTime(+en.rest || 90)}</span>
        <button class="btn sm ghost" onclick="Seance.bumpRest(${ei},15)">+ 15 s</button>
      </div>`,
      `<button class="btn wide primary" onclick="Modal.close();Seance._renderActive(document.getElementById('v-seance'))">Terminé</button>`);
  },
  _applyRest(ei, v) {
    const en = S.activeSession.entries[ei];
    en.rest = Math.max(0, Math.min(900, Math.round(v)));
    const day = S.program.find(d => d.id === S.activeSession.dayId);
    const exo = day && day.exos.find(x => x.id === en.exoId);
    if (exo) exo.rest = en.rest;
    save();
    return en.rest;
  },
  setRest(ei, v) {
    const r = this._applyRest(ei, v);
    Modal.close();
    this._renderActive(document.getElementById('v-seance'));
    toast('Repos réglé sur ' + fmtTime(r));
  },
  bumpRest(ei, d) {
    const r = this._applyRest(ei, (+S.activeSession.entries[ei].rest || 90) + d);
    const el = document.getElementById('restNow'); if (el) el.textContent = fmtTime(r);
    document.querySelectorAll('#restGrid .restchip').forEach(b => b.classList.toggle('on', +b.dataset.v === r));
  },
  toggleSet(ei, si) {
    const st = S.activeSession.entries[ei].sets[si]; st.done = !st.done; save();
    const exo = S.program[S.program.findIndex(d=>d.id===S.activeSession.dayId)]?.exos.find(x=>x.id===S.activeSession.entries[ei].exoId);
    if (st.done && exo) Timer.start(+exo.rest || 90);
    this._renderActive(document.getElementById('v-seance'));
  },
  addSet(ei) { const e = S.activeSession.entries[ei]; const last = e.sets[e.sets.length-1] || {}; e.sets.push({ weight: last.weight||'', reps: last.reps||'', done: false }); save(); this._renderActive(document.getElementById('v-seance')); },
  rmSet(ei) { const e = S.activeSession.entries[ei]; if (e.sets.length>1) e.sets.pop(); save(); this._renderActive(document.getElementById('v-seance')); },
  cancel() { Modal.confirm('Abandonner la séance ?', 'Les données saisies seront perdues.', () => { S.activeSession = null; save(); Timer.stop(); Ask.close(); Modal.close(); this.render(); }, 'Abandonner'); },
  finish() {
    const s = S.activeSession;
    // reporte la dernière charge dans le programme (pré-remplissage futur)
    const day = S.program.find(d => d.id === s.dayId);
    if (day) s.entries.forEach(en => { const done = en.sets.filter(x=>x.done && x.weight); if (done.length) { const w = done[done.length-1].weight; const exo = day.exos.find(x=>x.id===en.exoId); if (exo && w) exo.load = w + ' kg'; } });
    s.done = true; s.endDate = new Date().toISOString();
    S.history.push(s); S.activeSession = null; save(); Timer.stop(); Ask.close();
    App.go('seance'); toast('Séance enregistrée 💪 ' + Math.round(this._volume(s)) + ' kg soulevés');
  },
  viewHist(id) {
    const h = S.history.find(x => x.id === id); if (!h) return;
    Modal.open(h.dayName, `<p class="hint" style="margin-bottom:12px">${fmtDate(h.date)} · Volume total ${Math.round(this._volume(h))} kg</p>
      ${h.entries.map((e,ei)=>`<div style="margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <div style="font-weight:700;font-size:14px;flex:1">${esc(e.name)}</div>
          <button class="btn sm ghost" onclick="Seance.histMuscles('${h.id}',${ei})">🧍 Muscles</button></div>
        ${e.sets.map((st,i)=>`<div style="font-size:12px;color:${st.done?'var(--text)':'var(--muted)'};padding:2px 0">Série ${i+1} : ${st.weight||'—'} kg × ${st.reps||'—'} ${st.done?'✓':''}${st.d&&DIFFMAP[st.d]?` · ${DIFFMAP[st.d].ic} ${DIFFMAP[st.d].lab}`:''}</div>`).join('')}</div>`).join('')}`, '');
  },
  histMuscles(hid, ei) {
    const h = S.history.find(x => x.id === hid);
    if (h && h.entries[ei]) Muscles.show(h.entries[ei]);
  },
  delHist(id) { Modal.confirm('Supprimer cette séance ?', '', () => { S.history = S.history.filter(x=>x.id!==id); save(); Modal.close(); this.render(); }, 'Supprimer'); }
};
function fmtDate(iso) { const d = new Date(iso); return d.toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'short' }); }


/* ===== src/features/ask.js ===== */
/* ============================================================
   PENDANT LE REPOS — difficulté de la série et suggestion
   ============================================================ */
const Ask = {
  ei: null, si: null,
  el() { return document.getElementById('diffask'); },

  open(ei, si) {
    this.ei = ei; this.si = si;
    this.paint();
    const e = this.el(); if (e) e.classList.add('show');
  },
  close() {
    this.ei = null;
    const e = this.el(); if (e) { e.classList.remove('show'); e.innerHTML = ''; }
  },
  /* Fermer sans répondre : on lance quand même le repos */
  skip() {
    const en = S.activeSession && S.activeSession.entries[this.ei];
    this.close();
    if (en) Timer.start(+en.rest || 90);
    Seance._renderActive(document.getElementById('v-seance'));
  },

  paint() {
    const s = S.activeSession, e = this.el();
    if (!s || this.ei == null || !e) return;
    const en = s.entries[this.ei]; if (!en) { this.close(); return; }
    e.innerHTML = `
      <div class="dq"><span>Série ${this.si + 1} · ${esc(en.name)}<br><small>C'était comment ?</small></span>
        <button class="dclose" onclick="Ask.skip()">✕</button></div>
      <div class="diffbtns">${DIFFS.map(d => `<button class="dbtn" onclick="Ask.answer('${d.k}')"><span>${d.ic}</span>${d.lab}</button>`).join('')}</div>
      <p class="dhint">La série suivante s'ajuste toute seule, et le repos démarre.</p>`;
  },

  /* Ressenti enregistré -> série suivante préparée -> chrono lancé */
  answer(d) {
    const s = S.activeSession; if (!s) return;
    const en = s.entries[this.ei], st = en.sets[this.si];
    st.d = d; save();
    this.prepareNext(en, this.si, d);
    this.close();
    Timer.start(+en.rest || 90);
    Seance._renderActive(document.getElementById('v-seance'));
  },

  /* Déduit la charge / les reps de la série suivante à partir du ressenti */
  prepareNext(en, si, d) {
    const next = en.sets[si + 1];
    if (!next || next.done) { save(); return; }
    const st = en.sets[si];
    next.weight = st.weight;
    next.reps = st.reps;
    next.hint = '';
    if (d === 'correct') { next.hint = 'Même charge — tu étais dans la bonne zone.'; save(); return; }
    if (d === 'dur')     { next.hint = 'Même charge — série difficile, on consolide.'; save(); return; }
    const dir = d === 'facile' ? 1 : -1;
    const w = parseFloat(st.weight);
    const nw = (isNaN(w) || w <= 0) ? null : nextLoad(en.k, w, dir);
    if (nw != null && Math.abs(nw - w) > 0.001) {
      next.weight = String(nw);
      next.hint = dir > 0
        ? `+${round(nw - w, 2)} kg — la précédente était facile.`
        : `−${round(w - nw, 2)} kg — tu es allé à l'échec.`;
    } else {
      const r = parseInt(st.reps);
      if (!isNaN(r)) {
        const nr = Math.max(1, r + dir * 2);
        next.reps = String(nr);
        next.hint = dir > 0 ? '+2 reps — la précédente était facile.' : '−2 reps — tu es allé à l\'échec.';
      }
    }
    save();
  },
};


/* ===== src/features/fatigue.js ===== */
/* ============================================================
   CHARGE MUSCULAIRE — fatigue, récupération, schéma corporel
   ============================================================ */

/* Difficulté ressentie d'une série -> coefficient d'effort */
const DIFFS = [
  { k:'facile',  lab:'Facile',  ic:'😌', col:'#2ECC71', eff:0.55 },
  { k:'correct', lab:'Correct', ic:'💪', col:'#4E9BFF', eff:1.00 },
  { k:'dur',     lab:'Dur',     ic:'🔥', col:'#F39C12', eff:1.35 },
  { k:'echec',   lab:'Échec',   ic:'💀', col:'#E8432D', eff:1.60 },
];
const DIFFMAP = Object.fromEntries(DIFFS.map(d => [d.k, d]));
const SECONDARY_SHARE = 0.45;   // part de charge reçue par un muscle secondaire

/* Échelle de couleurs : 0 % bleu -> 100 % rouge */
const HEAT = [
  [0.00, [ 46,125,209]],  // bleu   — frais
  [0.25, [ 46,204,113]],  // vert   — prêt
  [0.50, [241,196, 15]],  // jaune  — partiellement récupéré
  [0.75, [255,149,  0]],  // orange — encore chargé
  [1.00, [232, 67, 45]],  // rouge  — saturé
];
function heatColor(p) {
  p = Math.max(0, Math.min(1, p || 0));
  for (let i = 1; i < HEAT.length; i++) {
    if (p <= HEAT[i][0]) {
      const [p0, c0] = HEAT[i-1], [p1, c1] = HEAT[i];
      const t = (p - p0) / (p1 - p0);
      const c = c0.map((v, j) => Math.round(v + (c1[j] - v) * t));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }
  }
  return 'rgb(232,67,45)';
}

const Fatigue = {
  /* multiplicateur de récupération réglé par l'utilisateur (1 = normal) */
  mult(z) { return (S.recovery && S.recovery[z]) || 1; },
  recHours(z) { return (ZMAPZ[z] ? ZMAPZ[z].rec : 48) * this.mult(z); },
  cap(z) { return ZMAPZ[z] ? ZMAPZ[z].cap : 12; },

  /* Zones touchées par un exercice (à partir de sa clé de bibliothèque ou de ses zones) */
  zonesOf(src) {
    if (!src) return { zp: [], zs: [] };
    if (src.zp || src.zs) return { zp: src.zp || [], zs: src.zs || [] };
    const b = LIBMAP[src.k]; return b ? { zp: b.zp || [], zs: b.zs || [] } : { zp: [], zs: [] };
  },

  /* Unités de charge d'une séance (terminée ou en cours) -> { zone: unités } */
  unitsOfSession(sess, onlyDone = true) {
    const u = {};
    (sess.entries || []).forEach(en => {
      const src = LIBMAP[en.k] || (en.exoId && this._exoInProgram(en.exoId)) || { zp: en.zp, zs: en.zs };
      const { zp, zs } = this.zonesOf(src);
      if (!zp.length && !zs.length) return;
      (en.sets || []).forEach(st => {
        if (onlyDone && !st.done) return;
        const eff = (DIFFMAP[st.d] || DIFFMAP.correct).eff;
        zp.forEach(z => u[z] = (u[z] || 0) + eff);
        zs.forEach(z => u[z] = (u[z] || 0) + eff * SECONDARY_SHARE);
      });
    });
    return u;
  },
  _exoInProgram(exoId) {
    for (const d of S.program) { const e = d.exos.find(x => x.id === exoId); if (e) return e; }
    return null;
  },

  /* Charge estimée d'un jour du programme (séries prévues, effort « correct ») */
  unitsOfDay(day) {
    const u = {};
    (day.exos || []).forEach(e => {
      const { zp, zs } = this.zonesOf(LIBMAP[e.k] || e);
      const n = Math.max(1, +e.sets || 1);
      zp.forEach(z => u[z] = (u[z] || 0) + n);
      zs.forEach(z => u[z] = (u[z] || 0) + n * SECONDARY_SHARE);
    });
    return u;
  },

  toPct(units) {
    const out = {};
    ZONES.forEach(z => { out[z.z] = Math.min(1.6, (units[z.z] || 0) / this.cap(z.z)); });
    return out;
  },

  /* Fatigue résiduelle actuelle : décroissance linéaire à vitesse 1 / recHours */
  current(atMs) {
    const now = atMs || Date.now();
    const res = {}; const meta = {};
    ZONES.forEach(z => { res[z.z] = 0; meta[z.z] = { last: null, sessions: 0 }; });
    const sessions = S.history.slice(-40);
    if (S.activeSession) sessions.push(S.activeSession);
    sessions.forEach(s => {
      const end = new Date(s.endDate || s.date).getTime();
      const hours = Math.max(0, (now - end) / 3600000);
      const pct = this.toPct(this.unitsOfSession(s));
      ZONES.forEach(zo => {
        const z = zo.z; if (!pct[z]) return;
        const rem = Math.max(0, pct[z] - hours / this.recHours(z));
        if (rem > 0) { res[z] += rem; meta[z].sessions++; }
        if (pct[z] > 0.05 && (!meta[z].last || end > meta[z].last)) meta[z].last = end;
      });
    });
    ZONES.forEach(z => { res[z.z] = Math.min(1, res[z.z]); });
    this._meta = meta;
    return res;
  },

  /* Heures restantes avant récupération complète d'une zone */
  readyIn(z, cur) {
    const v = (cur || this.current())[z] || 0;
    return v <= 0 ? 0 : v * this.recHours(z);
  },
  /* Heures avant de repasser sous 50 % (zone de nouveau entraînable) */
  trainableIn(z, cur) {
    const v = (cur || this.current())[z] || 0;
    return v <= 0.5 ? 0 : (v - 0.5) * this.recHours(z);
  },
};

function fmtHours(h) {
  if (h <= 0) return 'maintenant';
  if (h < 1) return Math.round(h * 60) + ' min';
  if (h < 24) return Math.round(h) + ' h';
  const d = Math.floor(h / 24), r = Math.round(h % 24);
  return d + ' j' + (r ? ' ' + r + ' h' : '');
}

const Charge = {
  mode: 'now',      // 'now' | 'day' | 'prog'
  dayIdx: 0,

  values() {
    if (this.mode === 'day') {
      const d = S.program[this.dayIdx]; return d ? Fatigue.toPct(Fatigue.unitsOfDay(d)) : {};
    }
    if (this.mode === 'prog') {
      const u = {};
      S.program.forEach(d => { const du = Fatigue.unitsOfDay(d); for (const k in du) u[k] = (u[k]||0) + du[k]; });
      const pct = {}; ZONES.forEach(z => pct[z.z] = Math.min(1.6, (u[z.z]||0) / (Fatigue.cap(z.z) * 1.8)));
      return pct;
    }
    return Fatigue.current();
  },

  render() {
    const v = document.getElementById('v-charge');
    const val = this.values();
    this._cache = val;
    const isNow = this.mode === 'now';
    const sorted = ZONES.slice().sort((a, b) => (val[b.z]||0) - (val[a.z]||0));
    const worked = sorted.filter(z => (val[z.z]||0) > 0.02);

    v.innerHTML = `
      <div class="sec-hd"><div><h2>CHARGE <span>MUSCULAIRE</span></h2>
        <p>${isNow ? 'Fatigue actuelle et récupération' : this.mode === 'day' ? 'Sollicitation prévue de la séance' : 'Répartition sur tout le programme'}</p></div></div>

      <div class="subtabs">
        <button class="subtab ${isNow?'on':''}" onclick="Charge.setMode('now')">Maintenant</button>
        <button class="subtab ${this.mode==='day'?'on':''}" onclick="Charge.setMode('day')">Une séance</button>
        <button class="subtab ${this.mode==='prog'?'on':''}" onclick="Charge.setMode('prog')">Programme</button>
      </div>

      ${this.mode === 'day' ? `<div class="field" style="margin-bottom:12px"><select class="select" onchange="Charge.pickDay(this.value)">
        ${S.program.map((d,i)=>`<option value="${i}"${i===this.dayIdx?' selected':''}>J${i+1} · ${esc(d.name)}</option>`).join('')}
      </select></div>` : ''}

      <div class="card" style="padding:14px 10px 10px">
        <div class="bodywrap">
          <div class="bodycol"><div class="bodylab">Avant</div>${bodySVG('front')}</div>
          <div class="bodycol"><div class="bodylab">Arrière</div>${bodySVG('back')}</div>
        </div>
        <div class="heatscale">
          <span>0 %</span><div class="heatbar"></div><span>100 %</span>
        </div>
        <p class="hint" style="text-align:center;margin-top:8px">
          ${isNow ? 'Bleu : récupéré · Rouge : à laisser récupérer' : 'Intensité de sollicitation'} — touche un muscle pour le détail</p>
      </div>

      ${isNow ? this._readyBlock(val) : ''}

      <div class="sec-hd" style="margin-top:22px"><div><h2>${isNow ? 'PAR MUSCLE' : 'DÉTAIL'}</h2>
        <p>${worked.length} muscle${worked.length>1?'s':''} concerné${worked.length>1?'s':''}</p></div></div>
      ${worked.length ? worked.map(z => this._row(z, val[z.z])).join('')
        : '<div class="empty"><p>Aucune charge enregistrée.<br>Termine une séance pour voir le schéma se remplir.</p></div>'}

      ${isNow ? `<button class="btn ghost block" style="margin-top:16px" onclick="Charge.settings()">⚙ Régler ma vitesse de récupération</button>` : ''}`;

    this.paint(val);
  },

  _readyBlock(val) {
    const ready = ZONES.filter(z => (val[z.z]||0) <= 0.35);
    const soon = ZONES.filter(z => (val[z.z]||0) > 0.35 && (val[z.z]||0) <= 0.65);
    const rest = ZONES.filter(z => (val[z.z]||0) > 0.65);
    const pill = (list, col, lab) => !list.length ? '' :
      `<div class="rdy"><span class="rdydot" style="background:${col}"></span>
        <div><b>${lab}</b><p>${list.map(z=>esc(z.sh)).join(' · ')}</p></div></div>`;
    return `<div class="card" style="padding:12px 14px;margin-top:12px">
      ${pill(ready, '#2ECC71', 'Prêts à travailler')}
      ${pill(soon, '#F39C12', 'Entraînables mais entamés')}
      ${pill(rest, '#E8432D', 'À laisser récupérer')}</div>`;
  },

  _row(z, p) {
    p = p || 0;
    const col = heatColor(p);
    const extra = this.mode === 'now'
      ? (p > 0.02 ? 'récupéré dans ' + fmtHours(Fatigue.readyIn(z.z, this._cache)) : '')
      : '';
    return `<div class="zrow" onclick="Charge.zoneTap('${z.z}')">
      <div class="zbar"><div class="zfill" style="height:${Math.max(4,Math.min(100,p*100))}%;background:${col}"></div></div>
      <div class="zmain"><b>${esc(z.lab)}</b><span>${extra}</span></div>
      <div class="zpct" style="color:${col}">${Math.round(p*100)}%</div></div>`;
  },

  paint(val) {
    this._cache = val;
    document.querySelectorAll('#v-charge .mz').forEach(el => {
      const p = val[el.dataset.z] || 0;
      el.style.fill = p < 0.02 ? '' : heatColor(p);
    });
  },

  setMode(m) { this.mode = m; this.render(); },
  pickDay(i) { this.dayIdx = +i; this.render(); },

  zoneTap(z) {
    const zo = ZMAPZ[z]; if (!zo) return;
    const val = this._cache || this.values();
    const p = val[z] || 0;
    const meta = (Fatigue._meta || {})[z] || {};
    const exos = LIB.filter(e => (e.zp||[]).includes(z)).slice(0, 8);
    const mult = Fatigue.mult(z);
    Modal.open(zo.lab, `
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
        <div class="bigpct" style="color:${heatColor(p)};border-color:${heatColor(p)}">${Math.round(p*100)}<small>%</small></div>
        <div style="flex:1">
          ${this.mode === 'now' ? `
            <div style="font-size:13px;font-weight:700;margin-bottom:3px">${p>0.65?'À laisser récupérer':p>0.35?'Entraînable, déjà entamé':'Prêt à travailler'}</div>
            <p class="hint">Récupération complète dans <b style="color:var(--text)">${fmtHours(Fatigue.readyIn(z, val))}</b></p>
            ${p>0.5?`<p class="hint">Repasse sous 50 % dans <b style="color:var(--text)">${fmtHours(Fatigue.trainableIn(z, val))}</b></p>`:''}
            ${meta.last?`<p class="hint">Dernier travail : ${fmtDate(new Date(meta.last).toISOString())}</p>`:''}`
          : `<div style="font-size:13px;font-weight:700">Sollicitation ${this.mode==='day'?'de la séance':'du programme'}</div>`}
        </div>
      </div>
      <div class="tip">Récupération de référence à 100 % : ${Math.round(ZMAPZ[z].rec * mult)} h${mult!==1?` (réglage perso ×${mult})`:''}</div>
      <div class="divider"></div>
      <label style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px">Vitesse de récupération</label>
      <div class="row3" style="margin-top:8px">
        ${[['0.7','Rapide'],['1','Normale'],['1.3','Lente']].map(([v,l])=>
          `<button class="btn sm ${Math.abs(mult-(+v))<0.01?'primary':'ghost'}" onclick="Charge.setMult('${z}',${v})">${l}</button>`).join('')}
      </div>
      <div class="divider"></div>
      <label style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px">Exercices qui le ciblent</label>
      <div class="chips" style="margin-top:8px">${exos.map(e=>`<span class="chip">${esc(e.name)}</span>`).join('') || '<span class="hint">—</span>'}</div>`, '');
  },

  setMult(z, m) {
    S.recovery = S.recovery || {};
    if (m === 1) delete S.recovery[z]; else S.recovery[z] = m;
    save(); Modal.close(); this.render(); toast('Récupération ajustée ✓');
  },

  settings() {
    Modal.open('Vitesse de récupération', `
      <p class="hint" style="margin-bottom:12px">Ajuste muscle par muscle si tu récupères plus vite ou plus lentement que la moyenne. La durée indiquée est le temps pour repartir de 100 % à 0 %.</p>
      ${ZONES.map(z=>{const m=Fatigue.mult(z.z);return `
        <div class="setline">
          <div><b>${esc(z.lab)}</b><span>${Math.round(z.rec*m)} h</span></div>
          <div class="rsegs">${[['0.7','−'],['1','='],['1.3','+']].map(([v,l])=>
            `<button class="rseg ${Math.abs(m-(+v))<0.01?'on':''}" onclick="Charge.setMultQuiet('${z.z}',${v},this)">${l}</button>`).join('')}</div>
        </div>`;}).join('')}`,
      `<button class="btn wide primary" onclick="Modal.close();Charge.render()">Terminé</button>`);
  },
  setMultQuiet(z, m, el) {
    S.recovery = S.recovery || {};
    if (m === 1) delete S.recovery[z]; else S.recovery[z] = m;
    save();
    const wrap = el.parentElement;
    wrap.querySelectorAll('.rseg').forEach(b => b.classList.remove('on'));
    el.classList.add('on');
    wrap.parentElement.querySelector('span').textContent = Math.round(ZMAPZ[z].rec * m) + ' h';
  },
};


/* ===== src/features/muscles.js ===== */
/* ============================================================
   SCHÉMA « MUSCLES TRAVAILLÉS » D'UN EXERCICE
   ============================================================ */
const Muscles = {
  /* Retrouve les zones d'un exercice, même sur des données anciennes :
     1) zones portées par l'entrée  2) clé de bibliothèque  3) correspondance par nom
     4) dernier recours : le groupe musculaire de l'exercice */
  zonesOf(e) {
    e = e || {};
    let b = (e.k && LIBMAP[e.k]) || null;
    if (!b && e.name) {
      const n = String(e.name).toLowerCase().trim();
      b = LIB.find(x => x.name.toLowerCase().trim() === n) || null;
    }
    b = b || {};
    let zp = (e.zp && e.zp.length) ? e.zp.slice() : (b.zp || []).slice();
    let zs = (e.zs && e.zs.length) ? e.zs.slice() : (b.zs || []).slice();
    if (!zp.length) zp = (CAT_ZONES[e.cat || b.cat] || []).slice();
    zs = zs.filter(z => !zp.includes(z));
    const mp = zp.map(ZLABEL), ms = zs.map(ZLABEL);
    return { zp, zs, mp: mp.length ? mp : ((e.mp && e.mp.length) ? e.mp : (b.mp || [])),
                     ms: ms.length ? ms : ((e.ms && e.ms.length) ? e.ms : (b.ms || [])) };
  },
  /* Injection différée : le schéma n'est construit qu'à la première ouverture */
  fill(elId, e) {
    const el = document.getElementById(elId);
    if (!el || el.dataset.done) return;
    el.dataset.done = '1';
    const z = this.zonesOf(e);
    el.innerHTML = muscleMap(z.zp, z.zs);
  },
  show(e) {
    const z = this.zonesOf(e);
    const body = (z.zp.length || z.zs.length)
      ? muscleMap(z.zp, z.zs) +
        `<div class="chips" style="margin-top:14px;justify-content:center">
          ${z.mp.map(m => `<span class="chip cm">${esc(m)}</span>`).join('')}
          ${z.ms.map(m => `<span class="chip cs">${esc(m)}</span>`).join('')}</div>`
      : `<div class="empty"><p>Muscles non renseignés pour cet exercice.<br>
          Ouvre-le dans Exercices pour lui associer un groupe musculaire.</p></div>`;
    Modal.open(e.name || 'Muscles travaillés', body, '');
  },
};

/* ===== src/features/progress.js ===== */
/* ============================================================
   PROGRESSION — évolution des charges et records personnels
   ============================================================
   Tout est recalculé depuis l'historique des séances : rien n'est
   stocké en double. Une série ne compte que si elle a été validée
   et qu'elle porte au moins une répétition.

   Deux familles d'exercices se mesurent différemment :
   au poids du corps la progression se lit en répétitions, partout
   ailleurs en kilos. Le mode est déduit des séries elles-mêmes,
   pas déclaré : un exercice fait en lesté bascule tout seul.
   ============================================================ */

/* 1RM estimé, formule d'Epley. Sert à comparer un 5×5 lourd et un
   3×12 léger sur la même échelle — en kilos, donc lisible. */
function e1RM(w, r) {
  w = +w || 0; r = +r || 0;
  if (!w || !r) return 0;
  return w * (1 + r / 30);
}

const Progress = {
  sort: 'recent',   // recent | progress | alpha
  q: '',

  /* ---------- agrégation ---------- */

  /** Historique regroupé par exercice, séance par séance, trié par date. */
  index() {
    const map = new Map();
    (S.history || []).filter(h => h.done).forEach(h => {
      (h.entries || []).forEach(en => {
        const sets = (en.sets || []).filter(s => s.done && (+s.reps || 0) > 0);
        if (!sets.length) return;
        const key = en.k || 'n:' + String(en.name || '').toLowerCase().trim();
        if (key === 'n:') return;
        let e = map.get(key);
        if (!e) map.set(key, e = {
          key, k: en.k || null,
          name: en.name || (LIBMAP[en.k] || {}).name || 'Exercice',
          sessions: [],
        });
        const best = sets.reduce((b, s) =>
          (e1RM(s.weight, s.reps) > e1RM(b.weight, b.reps)) ? s : b);
        e.sessions.push({
          date: h.date,
          sessionId: h.id,
          dayName: h.dayName || '',
          nsets: sets.length,
          reps: sets.reduce((a, s) => a + (+s.reps || 0), 0),
          topW: Math.max(...sets.map(s => +s.weight || 0)),
          topR: Math.max(...sets.map(s => +s.reps || 0)),
          volume: sets.reduce((a, s) => a + (+s.weight || 0) * (+s.reps || 0), 0),
          best: { w: +best.weight || 0, r: +best.reps || 0, e: e1RM(best.weight, best.reps) },
        });
      });
    });

    const out = [...map.values()];
    out.forEach(e => {
      e.sessions.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
      /* aucune charge jamais saisie : la progression se lit en répétitions */
      e.mode = e.sessions.every(s => s.topW === 0) ? 'reps' : 'load';
      e.metric = s => (e.mode === 'reps' ? s.topR : s.best.e);

      /* Marque les séances qui ont battu un record. La première ne compte
         pas : être la meilleure quand elle est la seule ne veut rien dire. */
      let high = 0;
      e.sessions.forEach((s, i) => {
        const m = e.metric(s);
        s.pr = i > 0 && m > high + 1e-9;
        if (m > high) high = m;
      });
      const byVol = e.sessions.reduce((a, s) => (s.volume > a.volume ? s : a));
      const byBest = e.sessions.reduce((a, s) => (e.metric(s) > e.metric(a) ? s : a));
      e.rec = {
        maxW: Math.max(...e.sessions.map(s => s.topW)),
        maxR: Math.max(...e.sessions.map(s => s.topR)),
        best: byBest.best,
        bestDate: byBest.date,
        maxVol: byVol.volume,
        maxVolDate: byVol.date,
      };
      e.last = e.sessions[e.sessions.length - 1];
      e.first = e.sessions[0];
      e.cur = e.metric(e.last);
      e.gain = e.cur - e.metric(e.first);
      e.gainPct = e.metric(e.first) ? e.gain / e.metric(e.first) * 100 : 0;
      e.lastDate = e.last.date;
    });
    return out;
  },

  /** Tous les records établis depuis `days` jours, le plus récent d'abord. */
  recentPRs(list, days = 30) {
    const since = Date.now() - days * 86400000;
    const out = [];
    list.forEach(e => e.sessions.forEach(s => {
      if (s.pr && new Date(s.date).getTime() >= since) out.push({ e, s });
    }));
    return out.sort((a, b) => (a.s.date < b.s.date ? 1 : -1));
  },

  /** Un seul record par exercice — le plus récent. Sinon la liste se répète. */
  latestPRs(list, days = 30) {
    const seen = new Set();
    return this.recentPRs(list, days).filter(x => !seen.has(x.e.key) && seen.add(x.e.key));
  },

  /* ---------- rendu ---------- */

  render() {
    const v = document.getElementById('v-progression');
    const list = this.index();

    if (!list.length) {
      v.innerHTML = `
        <div class="sec-hd"><div><h2>MA <span>PROGRESSION</span></h2><p>Rien à afficher pour l'instant</p></div></div>
        <div class="empty"><p>Termine une séance et tes charges apparaîtront ici :<br>
          courbe par exercice, 1RM estimé et records personnels.</p>
          <button class="btn primary" style="margin-top:14px" onclick="App.go('seance')">Aller à la séance</button></div>`;
      return;
    }

    const sessions = (S.history || []).filter(h => h.done).length;
    const tonnage = list.reduce((a, e) => a + e.sessions.reduce((b, s) => b + s.volume, 0), 0);
    const prs = this.recentPRs(list);
    const top = this.latestPRs(list);

    v.innerHTML = `
      <div class="sec-hd"><div><h2>MA <span>PROGRESSION</span></h2>
        <p>${list.length} exercice${list.length > 1 ? 's' : ''} suivi${list.length > 1 ? 's' : ''}</p></div></div>

      <div class="stat-grid">
        <div class="stat-card"><div class="sv">${sessions}</div><div class="sl">Séances</div></div>
        <div class="stat-card gold"><div class="sv">${fmtTonnage(tonnage)}</div><div class="sl">Tonnage total</div></div>
        <div class="stat-card blue"><div class="sv">${list.length}</div><div class="sl">Exercices</div></div>
        <div class="stat-card green"><div class="sv">${prs.length}</div><div class="sl">Records 30 j</div></div>
      </div>

      ${top.length ? `
        <div class="sec-hd" style="margin-top:20px"><div><h2>RECORDS <span>RÉCENTS</span></h2>
          <p>Le dernier de chaque exercice, sur 30 jours</p></div></div>
        <div class="prlist">
          ${top.slice(0, 6).map(({ e, s }) => `
            <div class="prow" onclick="Progress.open('${esc(e.key)}')">
              <span class="pmedal">🏆</span>
              <div class="pb"><h4>${esc(e.name)}</h4>
                <p>${e.mode === 'reps' ? s.topR + ' répétitions' : `${round(s.best.w, 1)} kg × ${s.best.r}`} · ${fmtShort(s.date)}</p></div>
              ${e.mode === 'reps' ? '' : `<div class="pv">${round(s.best.e)}<small>kg 1RM</small></div>`}
            </div>`).join('')}
        </div>` : ''}

      <div class="sec-hd" style="margin-top:22px"><div><h2>PAR <span>EXERCICE</span></h2>
        <p>Touche une ligne pour la courbe complète</p></div></div>

      <div class="seg" style="margin-bottom:10px" id="pgSort">
        <button class="${this.sort === 'recent' ? 'on' : ''}" onclick="Progress.setSort('recent')">Récents</button>
        <button class="${this.sort === 'progress' ? 'on' : ''}" onclick="Progress.setSort('progress')">Progression</button>
        <button class="${this.sort === 'alpha' ? 'on' : ''}" onclick="Progress.setSort('alpha')">A → Z</button>
      </div>
      <div class="field"><input class="input" id="pgSearch" placeholder="Rechercher un exercice…"
        value="${esc(this.q)}" oninput="Progress.search(this.value)"></div>
      <div id="pgList">${this._rows(list)}</div>`;
  },

  setSort(s) { this.sort = s; this.render(); },
  search(q) { this.q = q; document.getElementById('pgList').innerHTML = this._rows(this.index()); },

  _rows(list) {
    const q = this.q.toLowerCase().trim();
    let l = q ? list.filter(e => e.name.toLowerCase().includes(q)) : list.slice();
    if (this.sort === 'alpha') l.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    else if (this.sort === 'progress') l.sort((a, b) => b.gainPct - a.gainPct);
    else l.sort((a, b) => (a.lastDate < b.lastDate ? 1 : -1));
    if (!l.length) return '<p class="hint" style="text-align:center;padding:18px 0">Aucun exercice ne correspond.</p>';

    return l.map(e => {
      const unit = e.mode === 'reps' ? 'reps' : 'kg';
      const g = round(e.gain, e.mode === 'reps' ? 0 : 1);
      const cls = g > 0 ? 'up' : g < 0 ? 'down' : '';
      return `<div class="pgrow" onclick="Progress.open('${esc(e.key)}')">
        <div class="pgspark">${sparkline(e.sessions.map(s => e.metric(s)), g >= 0 ? 'var(--green)' : 'var(--gold)')}</div>
        <div class="pgb"><h4>${esc(e.name)}</h4>
          <p>${e.sessions.length} séance${e.sessions.length > 1 ? 's' : ''} · dernière le ${fmtShort(e.lastDate)}</p></div>
        <div class="pgv"><b>${round(e.cur, e.mode === 'reps' ? 0 : 1)}<small> ${unit}</small></b>
          <span class="pgd ${cls}">${g > 0 ? '+' : ''}${g}</span></div>
      </div>`;
    }).join('');
  },

  /* ---------- fiche d'un exercice ---------- */

  open(key) {
    const e = this.index().find(x => x.key === key);
    if (!e) return;
    const unit = e.mode === 'reps' ? 'reps' : 'kg';
    const dec = e.mode === 'reps' ? 0 : 1;
    const r = e.rec;

    const series = e.mode === 'reps'
      ? [{ label: 'Répétitions', color: 'var(--green)', pts: e.sessions.map(s => s.topR) }]
      : [{ label: '1RM estimé', color: 'var(--red)', pts: e.sessions.map(s => s.best.e) },
         { label: 'Charge max', color: 'var(--blue)', dash: true, pts: e.sessions.map(s => s.topW) }];

    Modal.open(e.name, `
      <div class="stat-grid" style="grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
        <div class="stat-card"><div class="sv">${round(e.cur, dec)}<small> ${unit}</small></div>
          <div class="sl">${e.mode === 'reps' ? 'Meilleure série' : '1RM estimé'} actuel</div></div>
        <div class="stat-card ${e.gain >= 0 ? 'green' : 'gold'}"><div class="sv">${e.gain > 0 ? '+' : ''}${round(e.gain, dec)}<small> ${unit}</small></div>
          <div class="sl">Depuis le ${fmtShort(e.first.date)}</div></div>
      </div>

      ${lineChart(series, e.sessions.map(s => s.date))}
      <div class="chartleg">${series.map(s =>
        `<span><i style="background:${s.color};${s.dash ? 'height:2px;opacity:.7' : ''}"></i>${s.label}</span>`).join('')}</div>

      <div class="divider"></div>
      <h5 class="mini-hd">Records personnels</h5>
      <div class="reclist">
        ${e.mode === 'reps' ? `
          <div class="recrow"><span>Meilleure série</span><b>${r.maxR} répétitions</b></div>
          <div class="recrow"><span>Le ${fmtShort(r.bestDate)}</span><b>${r.maxR} reps</b></div>`
        : `
          <div class="recrow"><span>Charge maximale</span><b>${round(r.maxW, 1)} kg</b></div>
          <div class="recrow"><span>Meilleure série</span><b>${round(r.best.w, 1)} kg × ${r.best.r}</b></div>
          <div class="recrow"><span>1RM estimé</span><b>${round(r.best.e)} kg <small style="color:var(--muted)">le ${fmtShort(r.bestDate)}</small></b></div>`}
        <div class="recrow"><span>Meilleur volume</span><b>${fmtTonnage(r.maxVol)} <small style="color:var(--muted)">le ${fmtShort(r.maxVolDate)}</small></b></div>
      </div>

      <div class="divider"></div>
      <h5 class="mini-hd">Séance par séance</h5>
      <div class="sesslist">
        ${e.sessions.slice().reverse().slice(0, 15).map(s => `
          <div class="recrow"><span>${fmtShort(s.date)}${s.pr ? ' <span class="prtag">record</span>' : ''}</span>
            <b>${e.mode === 'reps' ? s.topR + ' reps' : `${round(s.best.w, 1)} kg × ${s.best.r}`}
              <small style="color:var(--muted)">· ${s.nsets} série${s.nsets > 1 ? 's' : ''}</small></b></div>`).join('')}
      </div>
      ${e.sessions.length > 15 ? `<p class="hint" style="margin-top:8px">Les 15 dernières séances sur ${e.sessions.length}.</p>` : ''}

      <p class="hint" style="margin-top:12px">Le 1RM estimé (formule d'Epley) ramène toutes les séries à une même
        échelle : il monte aussi bien en ajoutant du poids qu'en ajoutant des répétitions.</p>`,
      `<button class="btn wide ghost" onclick="Modal.close()">Fermer</button>
       ${e.k ? `<button class="btn wide primary" onclick="Modal.close();Muscles.show(${JSON.stringify({ k: e.k, name: e.name }).replace(/"/g, '&quot;')})">Muscles travaillés</button>` : ''}`);
  },
};

/* ---------- graphiques ---------- */

function fmtTonnage(kg) {
  if (kg >= 1000) return round(kg / 1000, 1) + ' t';
  return Math.round(kg) + ' kg';
}
function fmtShort(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}

/** Courbe miniature, sans axes : donne la forme, pas les valeurs. */
function sparkline(vals, color) {
  if (!vals || vals.length < 2) return `<svg viewBox="0 0 60 26"><line x1="4" y1="13" x2="56" y2="13" stroke="var(--border)" stroke-width="2" stroke-linecap="round"/></svg>`;
  const W = 60, H = 26, pad = 3;
  const min = Math.min(...vals), max = Math.max(...vals), rng = (max - min) || 1;
  const pts = vals.map((v, i) => [
    pad + (i / (vals.length - 1)) * (W - 2 * pad),
    pad + (1 - (v - min) / rng) * (H - 2 * pad),
  ]);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${pts.map((p, i) => (i ? 'L' : 'M') + round(p[0], 1) + ' ' + round(p[1], 1)).join(' ')}"
      fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${round(pts[pts.length - 1][0], 1)}" cy="${round(pts[pts.length - 1][1], 1)}" r="2.6" fill="${color}"/></svg>`;
}

/**
 * Courbe multi-séries partageant une même échelle verticale.
 * `series` : [{ label, color, dash, pts:[nombres] }] — toutes de même longueur que `dates`.
 */
function lineChart(series, dates) {
  const all = series.flatMap(s => s.pts).filter(v => isFinite(v));
  if (all.length < 2 || series[0].pts.length < 2) {
    return '<p class="hint" style="text-align:center;padding:24px 0">Il faut au moins deux séances pour tracer une courbe.</p>';
  }
  const W = 320, H = 150, padL = 34, padR = 8, padT = 10, padB = 20;
  const min = Math.min(...all), max = Math.max(...all);
  const lo = min - (max - min || 1) * 0.12, hi = max + (max - min || 1) * 0.12;
  const n = series[0].pts.length;
  const x = i => padL + (n === 1 ? 0.5 : i / (n - 1)) * (W - padL - padR);
  const y = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  const gy = [hi, (hi + lo) / 2, lo];

  const uid_ = 'pg' + (lineChart._n = (lineChart._n || 0) + 1);
  return `<svg class="pgchart" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="${uid_}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${series[0].color}" stop-opacity=".28"/>
      <stop offset="1" stop-color="${series[0].color}" stop-opacity="0"/></linearGradient></defs>
    ${gy.map(v => `<line x1="${padL}" y1="${round(y(v), 1)}" x2="${W - padR}" y2="${round(y(v), 1)}"
        stroke="var(--border)" stroke-width="1"/>
      <text x="${padL - 5}" y="${round(y(v), 1) + 3.5}" text-anchor="end" class="ax">${round(v, v < 20 ? 1 : 0)}</text>`).join('')}
    <path d="${series[0].pts.map((v, i) => (i ? 'L' : 'M') + round(x(i), 1) + ' ' + round(y(v), 1)).join(' ')}
      L ${round(x(n - 1), 1)} ${H - padB} L ${round(x(0), 1)} ${H - padB} Z" fill="url(#${uid_})"/>
    ${series.map(s => `<path d="${s.pts.map((v, i) => (i ? 'L' : 'M') + round(x(i), 1) + ' ' + round(y(v), 1)).join(' ')}"
        fill="none" stroke="${s.color}" stroke-width="${s.dash ? 1.8 : 2.4}"
        ${s.dash ? 'stroke-dasharray="4 3" opacity=".75"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`).join('')}
    ${series[0].pts.map((v, i) => `<circle cx="${round(x(i), 1)}" cy="${round(y(v), 1)}" r="2.8" fill="${series[0].color}"/>`).join('')}
    <text x="${padL}" y="${H - 5}" class="ax">${fmtShort(dates[0])}</text>
    <text x="${W - padR}" y="${H - 5}" text-anchor="end" class="ax">${fmtShort(dates[n - 1])}</text>
  </svg>`;
}

/* ---- widgets nutrition ---- */
function ringSVG(consumed, target) {
  const r = 52, c = 2*Math.PI*r, pct = target ? Math.min(1, consumed/target) : 0;
  const over = consumed > target && target;
  const col = over ? 'var(--red)' : 'var(--green)';
  return `<div class="ring"><svg width="118" height="118" viewBox="0 0 118 118">
    <circle class="rc" cx="59" cy="59" r="${r}" stroke="var(--bg)" stroke-width="11"/>
    <circle class="rc" cx="59" cy="59" r="${r}" stroke="${col}" stroke-width="11" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}"/>
  </svg><div class="ring-ctr"><div class="big">${Math.round(consumed)}</div><div class="lbl">/ ${target} kcal</div></div></div>`;
}
function macroBar(name, cons, targ, col) {
  const pct = targ ? Math.min(100, cons/targ*100) : 0;
  return `<div class="mbar"><div class="mtop"><b>${name}</b><span>${Math.round(cons)} / ${targ} g</span></div>
    <div class="mtrack"><div class="mfill" style="width:${pct}%;background:${col}"></div></div></div>`;
}
function fmtDateFull(k){ const d=new Date(k+'T12:00:00'); return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}); }


/* ===== src/features/nutri-tips.js ===== */
/* ============================================================
   CONSEILS NUTRITION — lecture d'une journée et d'une semaine
   ============================================================
   Une fois que l'utilisateur a renseigné ses repas, l'app compare
   ce qu'il a mangé à ses objectifs et dit ce qui manque, en clair
   et en grammes d'aliments réels plutôt qu'en pourcentages.

   Les repères utilisés sont des repères d'entraînement classiques
   (1,6 à 2,2 g de protéines par kilo, un plancher de lipides pour
   l'équilibre hormonal, des glucides autour de la séance). Ce sont
   des ordres de grandeur, pas un avis médical : le panneau le dit.
   ============================================================ */

/* Repères, en grammes par kilo de poids de corps */
const PROT_MIN = 1.6, PROT_HIGH = 2.2, FAT_MIN = 0.7;
/* Tolérances autour de l'objectif calorique avant de signaler quoi que ce soit */
const KCAL_LOW = 0.85, KCAL_HIGH = 1.15;

const NutriTips = {

  /* ---------- lecture d'une journée ---------- */

  dayTips(dateKey) {
    const entries = S.nutrition.log[dateKey] || [];
    if (!entries.length) return [];

    const t = effectiveTargets();
    const tot = sumMacros(entries);
    const kg = +S.profile.weight || 0;
    const goal = S.profile.goal || 'masse';
    const tips = [];

    /* -- calories -- */
    const dk = tot.kcal - t.kcal;
    if (t.kcal && tot.kcal < t.kcal * KCAL_LOW) {
      tips.push({ lvl: 'warn', t: `Il te manque ${Math.round(-dk)} kcal`,
        d: goal === 'masse'
          ? 'En prise de masse, un déficit répété freine la récupération avant de freiner la prise de muscle. Ajoute plutôt des glucides : ils coûtent peu à digérer.'
          : goal === 'seche'
            ? 'Descendre bien en dessous de la cible fait fondre autant de muscle que de gras, et rend les séances plates. Le déficit prévu est déjà intégré à ton objectif.'
            : 'Tu es sous ton maintien. Sur plusieurs jours, ça finit par se voir sur les charges.' });
    } else if (t.kcal && tot.kcal > t.kcal * KCAL_HIGH) {
      tips.push({ lvl: goal === 'seche' ? 'bad' : 'warn', t: `${Math.round(dk)} kcal au-dessus de la cible`,
        d: goal === 'seche'
          ? 'Un dépassement ponctuel ne casse rien, mais répété il annule le déficit sans que la balance bouge dans le bon sens.'
          : 'Au-delà d\'un surplus modéré, le supplément part surtout en gras. Vise le haut de la fourchette, pas au-delà.' });
    } else if (t.kcal) {
      tips.push({ lvl: 'ok', t: 'Calories dans la cible', d: `${Math.round(tot.kcal)} kcal pour un objectif de ${t.kcal}.` });
    }

    /* -- protéines -- */
    const dp = t.p - tot.p;
    if (dp > 12) {
      tips.push({ lvl: 'warn', t: `${Math.round(dp)} g de protéines en moins`,
        d: `Soit à peu près ${protEquiv(dp)}. C'est le macro qui se rattrape le plus facilement, et celui qui compte le plus quand on s'entraîne ${(S.settings.daysPerWeek || 5)} fois par semaine.` });
    } else if (kg && tot.p / kg > PROT_HIGH + 0.6) {
      tips.push({ lvl: 'info', t: 'Protéines très hautes',
        d: `${round(tot.p / kg, 1)} g/kg. Au-delà de ${PROT_HIGH} g/kg le bénéfice ne monte plus ; ces calories serviraient mieux en glucides autour de la séance.` });
    } else {
      tips.push({ lvl: 'ok', t: 'Protéines couvertes',
        d: kg ? `${Math.round(tot.p)} g, soit ${round(tot.p / kg, 1)} g/kg — dans la fourchette ${PROT_MIN}–${PROT_HIGH}.` : `${Math.round(tot.p)} g.` });
    }

    /* -- glucides, surtout un jour de séance -- */
    const trained = this.trainedOn(dateKey);
    const dc = t.c - tot.c;
    if (dc > 40) {
      tips.push({ lvl: trained ? 'warn' : 'info', t: `${Math.round(dc)} g de glucides en moins`,
        d: trained
          ? 'Tu t\'es entraîné aujourd\'hui : les glucides sont le carburant des séries lourdes et ce qui reremplit les réserves ensuite. C\'est souvent là que se joue la sensation de séance molle.'
          : `Soit environ ${carbEquiv(dc)}. Rien de grave un jour de repos, mais c'est ce qui manque le plus souvent aux journées trop légères.` });
    }

    /* -- lipides : plancher hormonal -- */
    if (kg && tot.f < FAT_MIN * kg * 0.75) {
      tips.push({ lvl: 'warn', t: 'Lipides bas',
        d: `${Math.round(tot.f)} g aujourd'hui. En dessous d'environ ${Math.round(FAT_MIN * kg)} g par jour sur la durée, l'équilibre hormonal et l'absorption des vitamines A, D, E et K en pâtissent.` });
    }

    /* -- répartition sur la journée -- */
    const perMeal = MEALS.map(m => sumMacros(entries.filter(e => e.meal === m.k)));
    const biggest = perMeal.reduce((a, b) => (b.kcal > a.kcal ? b : a), { kcal: 0 });
    if (tot.kcal > 800 && biggest.kcal / tot.kcal > 0.55) {
      const name = MEALS[perMeal.indexOf(biggest)].label.toLowerCase();
      tips.push({ lvl: 'info', t: 'Journée concentrée sur un repas',
        d: `${Math.round(biggest.kcal / tot.kcal * 100)} % de tes calories sont sur le ${name}. Étaler sur trois ou quatre prises facilite la digestion et lisse l'apport en protéines.` });
    }
    const pMax = Math.max(...perMeal.map(m => m.p));
    if (kg && tot.p > 60 && pMax / tot.p > 0.6) {
      tips.push({ lvl: 'info', t: 'Protéines groupées sur un repas',
        d: `Trois à quatre prises d'environ ${Math.round(0.35 * kg)} g valent mieux qu'une seule grosse : la synthèse protéique se relance à chaque prise.` });
    }

    /* -- légumes et fruits -- */
    const cats = new Set(entries.map(e => (foodById(e.ref) || {}).cat).filter(Boolean));
    if (!cats.has('Légume') && !cats.has('Fruit')) {
      tips.push({ lvl: 'warn', t: 'Ni légume ni fruit aujourd\'hui',
        d: 'Fibres, micronutriments et volume dans l\'assiette : c\'est ce qui manque le plus souvent aux régimes construits autour des macros. Deux portions suffisent à changer la donne.' });
    }

    return tips;
  },

  /* ---------- lecture de la semaine ---------- */

  weekTips() {
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(); d.setDate(d.getDate() - i);
      days.push(todayKey(d));
    }
    const logged = days.filter(d => (S.nutrition.log[d] || []).length);
    const tips = [];

    if (!logged.length) return tips;

    if (logged.length < 5) {
      tips.push({ lvl: 'info', t: `${logged.length} jour${logged.length > 1 ? 's' : ''} renseigné${logged.length > 1 ? 's' : ''} sur 7`,
        d: 'Un journal à trous ne dit rien de fiable : ce sont presque toujours les jours non notés qui expliquent l\'écart entre ce qu\'on croit manger et ce que fait la balance. Cinq jours sur sept suffisent à voir juste.' });
    }

    const foods = new Set();
    logged.forEach(d => (S.nutrition.log[d] || []).forEach(e => foods.add(e.ref)));
    if (logged.length >= 4 && foods.size < 10) {
      tips.push({ lvl: 'info', t: `${foods.size} aliments différents sur la semaine`,
        d: 'Manger la même chose tous les jours simplifie la logistique, mais concentre aussi les carences éventuelles. Faire tourner deux ou trois sources par catégorie suffit.' });
    }

    /* tendance de poids sur quatre semaines, confrontée à l'objectif */
    const w = (S.weights || []).slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    const since = Date.now() - 28 * 86400000;
    const rec = w.filter(x => new Date(x.date + 'T12:00:00').getTime() >= since);
    if (rec.length >= 3) {
      const a = rec[0], b = rec[rec.length - 1];
      const weeks = Math.max(1, (new Date(b.date) - new Date(a.date)) / (7 * 86400000));
      const perWeek = (b.kg - a.kg) / weeks;
      const goal = S.profile.goal || 'masse';
      if (goal === 'masse' && perWeek < 0.05) {
        tips.push({ lvl: 'warn', t: 'Le poids ne monte pas',
          d: `${round(perWeek, 2)} kg/semaine sur trois semaines. Si l'objectif est de prendre, c'est que l'apport réel est au niveau du maintien : ajouter environ 200 kcal par jour et re-mesurer dans deux semaines est plus fiable que de tout changer d'un coup.` });
      } else if (goal === 'masse' && perWeek > 0.5) {
        tips.push({ lvl: 'warn', t: 'Le poids monte vite',
          d: `${round(perWeek, 2)} kg/semaine. Au-delà d'environ 0,3 kg/semaine, la part de gras dans la prise augmente nettement. Retirer 200 kcal ramène la pente sans casser la progression.` });
      } else if (goal === 'seche' && perWeek > -0.05) {
        tips.push({ lvl: 'warn', t: 'Le poids ne descend pas',
          d: `${round(perWeek, 2)} kg/semaine sur un mois. En sèche, un poids stable signifie que l'apport réel égale la dépense — souvent parce que les portions non pesées sont sous-estimées.` });
      } else {
        tips.push({ lvl: 'ok', t: 'Tendance cohérente avec l\'objectif',
          d: `${perWeek > 0 ? '+' : ''}${round(perWeek, 2)} kg/semaine sur le dernier mois.` });
      }
    } else {
      tips.push({ lvl: 'info', t: 'Trop peu de pesées récentes pour conclure',
        d: 'Le poids varie de plus d\'un kilo d\'un jour à l\'autre selon l\'eau et le contenu digestif. Trois pesées étalées sur un mois, dans les mêmes conditions, suffisent à dégager une tendance — et c\'est la tendance qui pilote les calories, pas la pesée du matin.' });
    }

    return tips;
  },

  /** Une séance a-t-elle été terminée ce jour-là ? */
  trainedOn(dateKey) {
    return (S.history || []).some(h => h.done && todayKey(new Date(h.date)) === dateKey);
  },

  /* ---------- rendu ---------- */

  /** Encart compact affiché dans le journal, sous les macros. */
  card(dateKey) {
    const tips = this.dayTips(dateKey);
    if (!tips.length) return '';
    const order = { bad: 0, warn: 1, info: 2, ok: 3 };
    const sorted = tips.slice().sort((a, b) => order[a.lvl] - order[b.lvl]);
    const head = sorted.slice(0, 2);
    return `<div class="tipcard">
      <div class="tiphd"><h4>Conseils du jour</h4>
        <button class="btn sm ghost" onclick="NutriTips.panel('${dateKey}')">Tout voir</button></div>
      ${head.map(x => this._row(x)).join('')}
      ${tips.length > head.length ? `<p class="hint" style="margin-top:6px">+ ${tips.length - head.length} autre${tips.length - head.length > 1 ? 's' : ''} remarque${tips.length - head.length > 1 ? 's' : ''}.</p>` : ''}
    </div>`;
  },

  _row(x) {
    const ic = { bad: '✕', warn: '!', info: 'i', ok: '✓' }[x.lvl];
    return `<div class="tiprow ${x.lvl}"><span class="tipic">${ic}</span>
      <div><h5>${esc(x.t)}</h5><p>${esc(x.d)}</p></div></div>`;
  },

  panel(dateKey) {
    dateKey = dateKey || Nutri.date;
    const day = this.dayTips(dateKey);
    const week = this.weekTips();
    Modal.open('Conseils nutrition', `
      <h5 class="mini-hd">Ta journée</h5>
      ${day.length ? day.map(x => this._row(x)).join('')
        : '<p class="hint">Rien à analyser : la journée est vide.</p>'}
      <div class="divider"></div>
      <h5 class="mini-hd">Ta semaine</h5>
      ${week.length ? week.map(x => this._row(x)).join('')
        : '<p class="hint">Renseigne quelques jours pour voir se dégager une tendance.</p>'}
      <div class="divider"></div>
      <p class="hint">Ce sont des repères d'entraînement généraux, calculés depuis ton profil et ce que tu as
        noté — pas un avis médical. Pour un plan adapté à ta situation, un diététicien du sport reste
        irremplaçable.</p>`,
      `<button class="btn wide primary" onclick="Modal.close()">Fermer</button>`);
  },
};

/* ---- équivalences en aliments réels : plus parlant qu'un nombre de grammes ---- */
function protEquiv(g) {
  const opts = [['f_poulet', 'de blanc de poulet'], ['f_fromageblanc', 'de fromage blanc'], ['f_oeuf', 'd\'œuf']];
  return _equiv(g, 'p', opts);
}
function carbEquiv(g) {
  const opts = [['f_riz', 'de riz cuit'], ['f_patate', 'de pommes de terre'], ['f_pain', 'de pain complet']];
  return _equiv(g, 'c', opts);
}
function _equiv(g, macro, opts) {
  for (const [id, label] of opts) {
    const f = foodById(id);
    if (!f || !f[macro]) continue;
    const grams = Math.round(g / f[macro] * 100 / 10) * 10;
    if (grams >= 30 && grams <= 600) return `${grams} g ${label}`;
  }
  const f = foodById(opts[0][0]);
  return f ? `${Math.round(g / f[macro] * 100)} g ${opts[0][1]}` : `${Math.round(g)} g`;
}

function bmiCat(b){ return b<18.5?'maigre':b<25?'normal':b<30?'surpoids':'obésité'; }
function weightChart(w) {
  if (w.length < 2) return '<p class="hint" style="text-align:center;padding:20px 0">Ajoute au moins 2 pesées pour voir la courbe.</p>';
  const W=320,H=110,pad=8;
  const kgs=w.map(x=>x.kg), min=Math.min(...kgs), max=Math.max(...kgs), rng=(max-min)||1;
  const pts=w.map((x,i)=>{ const px=pad+(i/(w.length-1))*(W-2*pad); const py=pad+(1-(x.kg-min)/rng)*(H-2*pad); return [px,py]; });
  const line=pts.map((p,i)=>(i?'L':'M')+round(p[0],1)+' '+round(p[1],1)).join(' ');
  const area=line+` L ${round(pts[pts.length-1][0],1)} ${H-pad} L ${pad} ${H-pad} Z`;
  return `<svg class="wchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--red)" stop-opacity=".35"/><stop offset="1" stop-color="var(--red)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#wg)"/><path d="${line}" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${round(p[0],1)}" cy="${round(p[1],1)}" r="3" fill="var(--red)"/>`).join('')}</svg>`;
}

  const d = defaultState();
  st = Object.assign({}, d, st);

  st.settings = Object.assign({}, d.settings, st.settings || {});
  st.nutrition = Object.assign({}, d.nutrition, st.nutrition || {});
  st.nutrition.targets = Object.assign({}, d.nutrition.targets, st.nutrition.targets || {});
  st.nutrition.log = st.nutrition.log || {};
  st.nutrition.foods = st.nutrition.foods || [];
  st.nutrition.recipes = st.nutrition.recipes || clone(RECIPES_SEED);
  st.nutrition.plans = st.nutrition.plans || clone(MEALPLANS_SEED);
  st.customExos = st.customExos || [];
  st.history = st.history || [];
  st.weights = st.weights || [];
  st.program = st.program || buildSeedProgram();
  delete st.gym;
  st.recovery = st.recovery || {};
  /* les anciennes séances n'ont pas de clé d'exercice : on la retrouve via le programme */
  (st.history || []).forEach(h => (h.entries || []).forEach(en => {
    if (en.k || !en.exoId) return;
    for (const d of st.program) { const e = (d.exos||[]).find(x => x.id === en.exoId); if (e && e.k) { en.k = e.k; break; } }
  }));
  st.v = 3;
  return st;
}

async function boot() {
  const saved = Store.load();
  S = saved ? migrate(saved) : defaultState();
  if (!saved) save();
  // barre d'action : menu
  document.getElementById('barActions').innerHTML =
    `<button class="iconbtn" onclick="App.menu()" title="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/><circle cx="5" cy="12" r="1.7"/></svg></button>`;
  // précharge les photos perso pour un rendu synchrone
  try { await Media.preload(allPhotoKeys()); } catch (e) {}
  try { Update.autoCheck(); } catch (e) {}
  App.go('programme');
  if (!Store.ok) toast('⚠ Stockage local indisponible — données non sauvegardées');
  // service worker (si servi en http/https)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
// bouton d'installation PWA
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });

document.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();

</script>
